<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#112938"/>
      <stop offset="60%" stop-color="#0a1822"/>
      <stop offset="100%" stop-color="#050d13"/>
    </radialGradient>
    <linearGradient id="screenFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102838" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081722" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42F5E8"/>
      <stop offset="50%" stop-color="#1FB6B6"/>
      <stop offset="100%" stop-color="#157D7D"/>
    </linearGradient>
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1FB6B6"/>
      <stop offset="35%" stop-color="#42F5E8"/>
      <stop offset="70%" stop-color="#6CFFE8"/>
      <stop offset="100%" stop-color="#1FB6B6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="1024"  fill="url(#bgGrad)"/>

  <!-- Prompter Glow -->
  <rect x="180" y="160" width="664" height="600" rx="60" fill="#1FB6B6" opacity="0.10" filter="url(#softGlow)"/>

  <!-- Prompter Screen Glass -->
  <rect x="188" y="168" width="648" height="584" rx="52" fill="url(#screenFill)" stroke="url(#tealBorder)" stroke-width="16"/>

  <!-- Camera Module at Top Center -->
  <rect x="448" y="172" width="128" height="36" rx="18" fill="#06121a" stroke="#1FB6B6" stroke-width="4" opacity="0.8"/>
  <circle cx="512" cy="190" r="10" fill="#0d2636" stroke="#42F5E8" stroke-width="3"/>
  <circle cx="512" cy="190" r="4" fill="#42F5E8"/>
  <!-- Recording Status Dot -->
  <circle cx="780" cy="204" r="8" fill="#FF4066" filter="url(#glow)"/>

  <!-- Script Line 1 (Header/Title) -->
  <line x1="256" y1="290" x2="440" y2="290" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <line x1="476" y1="290" x2="768" y2="290" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.35"/>

  <!-- Script Line 2 (Pre-reading Line) -->
  <line x1="256" y1="375" x2="560" y2="375" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
  <line x1="596" y1="375" x2="720" y2="375" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.4"/>

  <!-- Script Line 3 (Active Reading Line + Voice Soundwave) -->
  <!-- Ambient glow behind wave -->
  <path d="M 256 470 L 390 470 C 420 470, 435 380, 460 380 C 485 380, 500 550, 525 550 C 550 550, 565 395, 590 395 C 615 395, 630 520, 655 520 C 675 520, 685 470, 705 470 L 768 470"
        fill="none" stroke="#1FB6B6" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#glow)"/>

  <!-- Sharp luminous reading line and audio wave -->
  <path d="M 256 470 L 390 470 C 420 470, 435 380, 460 380 C 485 380, 500 550, 525 550 C 550 550, 565 395, 590 395 C 615 395, 630 520, 655 520 C 675 520, 685 470, 705 470 L 768 470"
        fill="none" stroke="url(#voiceGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Script Line 4 (Following Text) -->
  <line x1="256" y1="570" x2="520" y2="570" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
  <line x1="556" y1="570" x2="748" y2="570" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.4"/>

  <!-- Script Line 5 (Lower Script Text) -->
  <line x1="256" y1="655" x2="460" y2="655" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
  <line x1="496" y1="655" x2="660" y2="655" stroke="#1FB6B6" stroke-width="20" stroke-linecap="round" opacity="0.25"/>

  <!-- Glass Highlight Accent -->
  <path d="M 210 190 L 380 190 L 210 360 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Prompter Modern Stand Base -->
  <path d="M 428 752 L 596 752 L 626 800 L 398 800 Z" fill="#0a1d29" stroke="#1FB6B6" stroke-width="8" opacity="0.9"/>
  <rect x="360" y="800" width="304" height="20" rx="10" fill="#1FB6B6" opacity="0.85"/>
  <rect x="390" y="804" width="244" height="8" rx="4" fill="#42F5E8" opacity="0.6"/>
</svg>